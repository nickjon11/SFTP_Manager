
name: Build SFTP Manager

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-15-intel
            platform: macos
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check source
        run: python -m compileall -q main.py sftp_manager

      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "SFTP Manager" --add-data "sftp_manager/assets;sftp_manager/assets" --collect-all cryptography --collect-all cffi --collect-all paramiko main.py
          Compress-Archive -Path "dist/SFTP Manager" -DestinationPath "SFTP_Manager_v0.8.0_Windows.zip"

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "SFTP Manager" --add-data "sftp_manager/assets:sftp_manager/assets" --collect-all cryptography --collect-all cffi --collect-all paramiko main.py
          test -d "dist/SFTP Manager.app"
          mkdir dmg-content
          cp -R "dist/SFTP Manager.app" dmg-content/
          ln -s /Applications dmg-content/Applications
          hdiutil create -volname "SFTP Manager" -srcfolder dmg-content -format UDZO "SFTP_Manager_v0.8.0_macOS_Intel.dmg"

      - name: Build Debian package
        if: matrix.platform == 'linux'
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name sftp-manager --add-data "sftp_manager/assets:sftp_manager/assets" --collect-all cryptography --collect-all cffi --collect-all paramiko main.py
          mkdir -p pkg/DEBIAN pkg/opt/sftp-manager pkg/usr/bin pkg/usr/share/applications
          cp -a dist/sftp-manager/. pkg/opt/sftp-manager/
          printf 'Package: sftp-manager\nVersion: 0.8.0\nSection: net\nPriority: optional\nArchitecture: amd64\nMaintainer: IT610 Project\nDescription: SFTP Manager desktop client\n' > pkg/DEBIAN/control
          printf '#!/bin/sh\nexec /opt/sftp-manager/sftp-manager "$@"\n' > pkg/usr/bin/sftp-manager
          chmod +x pkg/usr/bin/sftp-manager
          printf '[Desktop Entry]\nType=Application\nName=SFTP Manager\nExec=/usr/bin/sftp-manager\nTerminal=false\nCategories=Network;FileTransfer;\n' > pkg/usr/share/applications/sftp-manager.desktop
          dpkg-deb --build --root-owner-group pkg SFTP_Manager_v0.8.0_Linux_amd64.deb

      - name: Upload Windows
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: SFTP_Manager_v0.8.0_Windows.zip

      - name: Upload macOS
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: macos-client
          path: SFTP_Manager_v0.8.0_macOS_Intel.dmg

      - name: Upload Linux
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-client
          path: SFTP_Manager_v0.8.0_Linux_amd64.deb

