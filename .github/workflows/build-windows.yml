
name: Build SFTP Manager

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-15-intel
            platform: macos
          - os: ubuntu-24.04
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare application package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build_src/sftp_manager

          cp -R SFTP_Manager/. build_src/sftp_manager/
          cp main.py build_src/main.py

          test -f build_src/sftp_manager/__init__.py
          test -f build_src/sftp_manager/app.py

          echo "Application package prepared."

      - name: Install Linux GUI libraries
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libopengl0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python source
        run: python -m compileall -q build_src

      - name: Verify application imports
        shell: bash
        run: |
          set -euo pipefail

          cd build_src

          python -c "import sftp_manager.app; print('Application import successful')"

      # Windows
      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Set-Location build_src

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name "SFTP Manager" `
            --add-data "sftp_manager/assets;sftp_manager/assets" `
            --collect-all cryptography `
            --collect-all cffi `
            --collect-all paramiko `
            main.py

          if (!(Test-Path "dist/SFTP Manager/SFTP Manager.exe")) {
            throw "Windows executable not found"
          }

          Compress-Archive `
            -Path "dist/SFTP Manager" `
            -DestinationPath "../SFTP_Manager_v0.8.0_Windows.zip"

      # macOS Intel
      - name: Build macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail

          cd build_src

          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name "SFTP Manager" \
            --add-data "sftp_manager/assets:sftp_manager/assets" \
            --collect-all cryptography \
            --collect-all cffi \
            --collect-all paramiko \
            main.py

          test -d "dist/SFTP Manager.app"

          mkdir -p dmg-content
          cp -R "dist/SFTP Manager.app" dmg-content/
          ln -s /Applications dmg-content/Applications

          hdiutil create \
            -volname "SFTP Manager" \
            -srcfolder dmg-content \
            -format UDZO \
            "../SFTP_Manager_v0.8.0_macOS_Intel.dmg"

      # Debian / Ubuntu x86-64
      - name: Build Debian package
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          cd build_src

          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name sftp-manager \
            --add-data "sftp_manager/assets:sftp_manager/assets" \
            --collect-all cryptography \
            --collect-all cffi \
            --collect-all paramiko \
            main.py

          test -x dist/sftp-manager/sftp-manager

          mkdir -p pkg/DEBIAN
          mkdir -p pkg/opt/sftp-manager
          mkdir -p pkg/usr/bin
          mkdir -p pkg/usr/share/applications

          cp -a dist/sftp-manager/. pkg/opt/sftp-manager/

          cat > pkg/DEBIAN/control <<'EOF'
          Package: sftp-manager
          Version: 0.8.0
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: IT610 Project <nickjon11@users.noreply.github.com>
          Depends: libegl1, libopengl0, libxkbcommon-x11-0, libxcb-cursor0
          Description: SFTP Manager desktop SSH and SFTP client
          EOF

          cat > pkg/usr/bin/sftp-manager <<'EOF'
          #!/bin/sh
          exec /opt/sftp-manager/sftp-manager "$@"
          EOF

          chmod 755 pkg/usr/bin/sftp-manager

          cat > pkg/usr/share/applications/sftp-manager.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=SFTP Manager
          Exec=/usr/bin/sftp-manager
          Terminal=false
          Categories=Network;FileTransfer;
          EOF

          dpkg-deb --build --root-owner-group \
            pkg ../SFTP_Manager_v0.8.0_Linux_amd64.deb

      # Upload Windows artifact
      - name: Upload Windows
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: SFTP_Manager_v0.8.0_Windows.zip
          if-no-files-found: error

      # Upload macOS artifact
      - name: Upload macOS
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: macos-client
          path: SFTP_Manager_v0.8.0_macOS_Intel.dmg
          if-no-files-found: error

      # Upload Linux artifact
      - name: Upload Linux
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-client
          path: SFTP_Manager_v0.8.0_Linux_amd64.deb
          if-no-files-found: error
